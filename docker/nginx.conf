# CityGap frontend：提供 Vite build 出來的靜態檔，並把 API / Swagger 同源轉給 backend container。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 用 Docker 內建 DNS 在執行期解析 backend，backend 重啟時 nginx 不會因為 upstream 找不到而掛掉
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8000";

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # REST API（瀏覽器打的是同源 /api/...，不需要 CORS）
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/sync 會同步下載約 30 MB 的政府資料，可能跑十幾秒
        proxy_read_timeout 300s;
    }

    # 讓 http://localhost:3000/docs 也能看 Swagger（主要入口仍是 http://localhost:8000/docs）
    location = /docs {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
    location = /redoc {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # 檔名含 hash 的靜態資源可長期快取
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
